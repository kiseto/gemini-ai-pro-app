<!doctype html>
<html lang="en" class="dark scroll-smooth" style="color-scheme: dark; background-color: #12100f">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#12100f" />

		<!-- Anti-FOUC & custom scrollbar: guarantee instant dark paint & sleek scrollbar before external CSS loads -->
		<style>
			:root,
			html,
			body {
				color-scheme: dark !important;
				background-color: #12100f !important;
				color: #f5f5f5 !important;
			}

			* {
				scrollbar-width: thin;
				scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
			}

			::-webkit-scrollbar {
				width: 7px;
				height: 7px;
			}

			::-webkit-scrollbar-track {
				background: transparent;
			}

			::-webkit-scrollbar-thumb {
				background-color: rgba(255, 255, 255, 0.16);
				border-radius: 9999px;
				border: 1.5px solid transparent;
				background-clip: padding-box;
			}

			::-webkit-scrollbar-thumb:hover {
				background-color: rgba(245, 158, 11, 0.5);
			}

			::-webkit-scrollbar-corner {
				background: transparent;
			}

			::-webkit-scrollbar-button {
				display: none;
				width: 0;
				height: 0;
			}
		</style>
		<script>
			document.documentElement.classList.add("dark");
			document.documentElement.style.colorScheme = "dark";
		</script>

		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/16.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icons/192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icons/512.png" />

		<link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
		<meta name="apple-mobile-web-app-title" content="Google AI Pro Portal" />

		<link rel="manifest" href="/site.webmanifest" />

		<title>Google AI Pro Portal</title>
	</head>

	<body
		class="dark"
		style="color-scheme: dark; background-color: #12100f; color: #f5f5f5; margin: 0"
	>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
