						"name": "Why are promotional offer tiers regionally specific?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Google configures its promotional offer SKUs for specific regional billing configurations (primarily US). Google Play evaluates offer eligibility and calculates checkout pricing according to the region and currency settings of your Google payment profile."
						}
					},
					{
						"@type": "Question",
						"name": "How does the Checkout Safety Guard protect me from accidental charges?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "The safety guard executes directly inside Google Play's tokenized checkout iframe (tokenized.play.google.com). Before you confirm, it inspects the live rendered pricing terms. If terms like 'Free trial' and '$0.00' are verified, it mounts a green safety banner. If it detects any paid terms—such as 'Charged today' or 'Pay now'—it surfaces a prominent red warning instructing you not to proceed."
						}
					},
					{
						"@type": "Question",
						"name": "How does the 24-month stacking sequence work?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Google One allows promotional SKUs to be applied sequentially as subscription extensions. Applying Tier 1 grants 12 months. Applying Tier 2 stacks an extra 6 months (advancing renewal to month 18). Finally, applying Tier 3 adds another 6 months, locking in the maximum allowable 24 months (2 full years) on a single Google account."
						}
					},
					{
						"@type": "Question",
						"name": "Will Google automatically bill my card when the promotional period ends?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Not if you cancel renewal. Once all tiers are stacked, open play.google.com/store/account/subscriptions and cancel the subscription. Google's policy guarantees that all 24 months of promotional 5TB storage and Gemini Advanced remain fully valid until expiration, after which your account simply reverts to the free tier with zero charges."
						}
					},
					{
						"@type": "Question",
						"name": "Where do promotional tokens come from and how are they kept updated?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Promotional offer tokens correspond to official Google One promotional campaigns (such as hardware bundles and partner promotions). When campaigns rotate or renew, updated extension builds are published on GitHub. The extension also supports local storage overrides, allowing developers to configure custom token parameters without rebuilding from source."
						}
					},
					{
						"@type": "Question",
						"name": "Does this extension send any account data or tokens to an external server?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "None. The extension runs 100% client-side in your browser with zero remote backend, analytics, or telemetry tracking. Network requests only occur between your browser and official Google domains (one.google.com and play.google.com)."
						}
					}
